services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_platform
    ports:
      # Host 5433, not 5432: a sibling project's Postgres commonly owns 5432 on
      # dev machines, and binding there silently produced a container that never
      # started while the app pointed at the wrong database. DB_PORT in .env
      # matches this.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # For production-like file storage. Local dev uses disk by default.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: support
      MINIO_ROOT_PASSWORD: supportsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
